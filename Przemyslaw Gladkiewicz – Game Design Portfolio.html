<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Przemyslaw Gladkiewicz – Game Design Portfolio</title>
<style>
:root{--bg:#f6f5f1;--surface:#ffffff;--text:#1b1b1f;--muted:#62626b;--accent:#d9480f;--line:#e2e0d9;--ph1:#c9d6ff;--ph2:#e2e2e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--surface:#1b1c21;--text:#eeeef2;--muted:#a0a0ab;--accent:#ff8a4c;--line:#2b2c33;--ph1:#2a3350;--ph2:#1f2025}}
:root[data-theme="dark"]{--bg:#121316;--surface:#1b1c21;--text:#eeeef2;--muted:#a0a0ab;--accent:#ff8a4c;--line:#2b2c33;--ph1:#2a3350;--ph2:#1f2025}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
nav{border-bottom:1px solid var(--line);padding:16px 0;font-family:system-ui,Arial,sans-serif;font-size:.95rem}
nav .wrap{display:flex;justify-content:space-between;gap:16px}
nav a:hover,.back:hover{color:var(--accent)}
.back{display:inline-block;margin:32px 0 0;font-family:system-ui,Arial,sans-serif;color:var(--muted);font-size:.95rem}
.hero{padding:80px 0 48px;border-bottom:1px solid var(--line)}
.kicker{font-family:system-ui,Arial,sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.8rem;color:var(--accent);margin:0 0 12px}
h1{font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.1;margin:0 0 20px}
.hero p{max-width:620px;font-size:1.15rem;color:var(--muted);margin:0}
h2{font-size:1.6rem;margin:56px 0 28px}
.project{display:flex;align-items:center;gap:40px;margin-bottom:56px;cursor:pointer}
.project:nth-child(even){flex-direction:row-reverse}
.shot{flex:1 1 55%;aspect-ratio:16/9;border-radius:14px;border:1px solid var(--line);background:linear-gradient(135deg,var(--ph1),var(--ph2));display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:system-ui,Arial,sans-serif;font-size:.9rem;overflow:hidden;transition:transform .2s}
.project:hover .shot{transform:scale(1.015)}
.shot img{width:100%;height:100%;object-fit:cover}
.info{flex:1 1 45%}
.info h3{font-size:1.5rem;margin:0 0 6px}
.project:hover h3{color:var(--accent)}
.role{font-family:system-ui,Arial,sans-serif;color:var(--accent);font-weight:600;margin:0 0 14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0 0 16px;font-family:system-ui,Arial,sans-serif;font-size:.9rem}
dt{color:var(--muted)}dd{margin:0}
.info p.d{margin:0;color:var(--muted)}
.more{display:inline-block;margin-top:14px;font-family:system-ui,Arial,sans-serif;color:var(--accent);font-weight:600;font-size:.95rem}
.phead{padding:24px 0 40px}
.phead h1{margin-bottom:8px}
.phead dl{max-width:420px;margin-top:20px}
.big{aspect-ratio:21/9;width:100%;margin-bottom:32px}
.long{max-width:760px;font-size:1.1rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px;margin-bottom:64px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s;display:block}
.tile:hover{transform:translateY(-4px);border-color:var(--accent)}
.tile .shot{aspect-ratio:4/3;border:0;border-radius:0;flex:none;width:100%}
.tile .t{padding:14px 16px 18px}
.tile h4{margin:0 0 4px;font-size:1.05rem}
.tile p{margin:0;color:var(--muted);font-size:.9rem;font-family:system-ui,Arial,sans-serif}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-family:system-ui,Arial,sans-serif}.card h4{margin:0 0 18px;font-family:Georgia,"Times New Roman",serif;font-size:1.3rem;color:var(--text)}.pills{display:flex;flex-wrap:wrap;gap:10px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 16px;color:var(--muted);font-size:.95rem}.card{padding:24px 26px}.card p,.card ul{margin:0;color:var(--muted);font-size:.95rem}.card ul{padding-left:18px}
.secondary{margin-top:72px;padding-top:8px;border-top:1px solid var(--line)}.secondary h3{font-size:1.1rem;margin:36px 0 16px;color:var(--muted)}.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.m{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:system-ui,Arial,sans-serif;background:transparent}a.m:hover{border-color:var(--accent)}.m h5{margin:0;font-size:.95rem}.m span{font-size:.8rem;color:var(--accent)}.m p{margin:6px 0 0;font-size:.85rem;color:var(--muted)}
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;margin:24px 0}.vid{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}.vid.doc{aspect-ratio:4/3}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:32px}@media (max-width:760px){.duo{grid-template-columns:1fr}}
nav .links{display:flex;gap:22px}.hero+main{padding-top:56px}.card li{margin:8px 0}.card li strong{color:var(--text);font-weight:500}
.bigsec{margin-top:80px;padding-top:36px;border-top:1px solid var(--line)}.bigsec h2{font-size:clamp(2rem,5vw,3rem);margin:0 0 20px}
.job{border-left:2px solid var(--line);padding:0 0 4px 20px;margin-bottom:28px}.jh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.jh h3{margin:0;font-size:1.25rem}.jh span{color:var(--muted);font-size:.9rem;font-family:system-ui,Arial,sans-serif}.job ul{color:var(--muted);padding-left:18px;margin:8px 0 0}.job .role{margin:4px 0 8px}
.play{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text);background:linear-gradient(135deg,var(--ph1),var(--ph2));font-family:system-ui,Arial,sans-serif;transition:transform .2s,border-color .2s}.play:hover{transform:scale(1.015);border-color:var(--accent)}.play span{font-size:2.4rem;color:var(--accent);line-height:1}.play b{font-weight:600}
footer{border-top:1px solid var(--line);padding:32px 0 48px;color:var(--muted);font-family:system-ui,Arial,sans-serif;font-size:.9rem;margin-top:48px}
@media (max-width:760px){.project,.project:nth-child(even){flex-direction:column;align-items:stretch;gap:20px}.shot{flex:none;width:100%}.big{aspect-ratio:16/9}}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.tag{border:1px solid var(--line);border-radius:999px;padding:2px 11px;font-family:system-ui,Arial,sans-serif;font-size:.78rem;color:var(--muted)}
.btn{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:6px 16px;margin:0 10px 10px 0;font-family:system-ui,Arial,sans-serif;font-size:.9rem}.btn:hover{background:var(--accent);color:var(--bg)}
.article{max-width:760px;margin-top:24px}.article img{display:block;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin:14px 0}.article h4{margin:30px 0 8px;font-size:1.15rem}.article p,.article ul{color:var(--muted)}
.m img{width:100%;height:auto;border-radius:6px;margin-bottom:8px}.secondary .intro{font-family:system-ui,Arial,sans-serif;font-size:.9rem;color:var(--muted);margin:16px 0 0}.secondary h3 small{font-weight:400;font-size:.85rem}
</style>
</head>

ng Appointments<\/h4><ul><li>Less loss for the tattoo artist<\/li><li>Satisfied clients with lower prices and quicker appointments<\/li><\/ul><h4>Motivation to Enable Notifications<\/h4><ul><li>Did your favorite artist set up a promotional slot? Allowing alerts keeps users updated and encourages regular app visits.<\/li><li>Clients receive notifications about promotional appointments with their favorite artists, motivating them to return to the app more often.<\/li><\/ul><h4>Increased Profitability of the Platform<\/h4><ul><li>A higher number of completed appointments directly translates to increased company profit.<\/li><\/ul><h4>Foundation for New Features<\/h4><ul><li>This change lays the groundwork for introducing new functionalities, such as promotions for designs the artist wants to clear or is eager to execute.<\/li><\/ul><h4><strong>✏️ Summary:<\/strong><\/h4><p>The implementation of dynamic promotions for canceled appointments effectively addresses the issue of empty slots, increases the profitability of the app, and enhances the user experience. Clients gain access to cheaper, faster appointments, while artists minimize losses from cancellations. Additionally, this feature boosts user engagement, encouraging them to regularly visit the app and make use of notifications. This solution opens up new opportunities for platform development and the implementation of additional features.<\/p>"}, {"group": "Tattoo session booking app", "title": "Optimization of the Custom Tattoo Ordering Process", "intro": "The current process of ordering a custom tattoo design is time-consuming and inefficient, which can lead to misunderstandings and discourage customers.", "body": "<h4><strong>⛔ Problem:<\/strong><\/h4><h4>Lack of automated Booking System<\/h4><ul><li>The process of scheduling a session requires multi-step communication between the client and the artist.<\/li><li>Despite the availability of a pre-prepared question template from the tattoo artist, there is often a need for additional clarification.<\/li><\/ul><h4>Client retention<\/h4><ul><li>A prolonged booking process increases the risk of client cancellation.<\/li><li>Fear of commitment (direct contact) from uncertain clients.<\/li><li>Some clients cancel after receiving detailed questions from the tattoo artist.<\/li><li>It sometimes turns out just before the session that the client is underage.<\/li><\/ul><h4>Risk of mismatch between Client’s vision and Tattoo Artist’s style<\/h4><ul><li>A client requesting a tattoo that is outside the tattoo artist's style.<\/li><li>The tattoo artist may spend hours of unpaid work only to find out that the client is no longer interested.<\/li><\/ul><h4><strong>💡 Solution:<\/strong><\/h4><h4>Development of a booking system<\/h4><ul><li>A personalized form containing selected elements by the artist (e.g., description, placement, size, sketch/reference image)<\/li><li>No possibility of proceeding with the tattoo request without filling out all fields.<\/li><\/ul><img src=\"data:image/webp;base64,UklGRmonAABXRUJQVlA4IF4nAABwDwGdASpvAsgCPpVIn0ylo6olojMZ6UASiWlu5Kgep8aANsxuFiPOn+Q/q/sj8Mfwn5Yef/iV9Te5P915lvV3mR/LfuX+g/Nr/Ce3/+v/xvjT8i/671Bfyb+Yf6L7dvVX2Yuv/8T9ifYC9d/pP+2/wH7xf570x/5b/Efur7ufo39+/0v94+AD+W/0j/hfb187f6j/sf1Xy3/un+2/an4Af53/aP9v/efyH+mf+y/9X+g/1vp3/SP8//4f9b8A/80/sH/Z/wvtif//3N/uj///dP/Yz/9CuC3Rmm/uRX+gEJB2HsrsH7gu2OEBKh1MqGQgJUOplQ4OLkvvU9Au4MfE6gXz3Aji+OOfJPSYtJQntbqvd5OQHlXF/d5OQHlXF/d4P/2v35YeGAIMmRVccVTANlRK46r25SkItxnRwj1tZORdz8y4fYVUAaf1aDz6b2erv0MmMHKW/QyYwcpb8/nzLX2OIxygBDY8W3pdscICVDqZUMhASodSo1nnShWY3gRkyTPtAMkOnXUZWbzxdFWpZlepHYFpwFsg7ZerNEIK0p8IJwVItTkodzbAoFH/T1qbhosCAk8tk6K3E1U+B+4LtjhASobeQgNEZANKwYzbpGta+6GrhLASrOQM/RigHpBLd85gB8v8hD4XBeMyyXjzUDAvcF2xwgJUOplQgFM4UwLI9Ha2mXwQNr/3OyT09WeZEoFIVf1Ln6UFT3f8QT2P/fLWZCJeXR4cYTjI1Cb0vFZ4fShmvJ44b/1rXzU9rRqHyPw6Vp5woaVTPyM+NFuBrYR71IdM1JtI2mcLzNUvPpJBenGtPWZFTPsqywCJQhgjvZmNdvZ3F9pJHF+QNs5qeUrIGoSRmtl75+2OQ75U9gbvPtn8y8Uo36g8/njg9pWteB7Vewy9NrkYLI+MbfxYdhxN+2RyYoL87AUH z00eGU2IkYUsJGcXufhJN1vhIcJ0WUuRCMf2AG2PgCGY9FXurKdAHACFhzcJmcRfh0RjJ1eQIuh4ka2LTlYtNd9qREL66EZrMXliFRMNZD54H+5rKBwMHN6XAGUd15+y9qIChSmATk8AVLXFdPGBleEay98isxgi4Z0mMoZgyai1Q+VzpBK8ggfN6BNBwjDIAbgTVc6rU3BVkAj30VugapzKMV+iKABlPQdnnB4RPYqQL/2qkHIwGoAAAA\" alt=\"\"><h4><strong>📈 Effects:<\/strong><\/h4><h4>Shortening the custom design ordering process<\/h4><ul><li>All necessary information is collected during the first contact.<\/li><li>No need for the artist to ask follow-up questions about unanswered details.<\/li><\/ul><h4>Reduced spam<\/h4><ul><li>Filling out the form requires an incentive from the client and reassures them about their intent to proceed with the purchase.<\/li><\/ul><h4>Easier entry point<\/h4><ul><li>For someone getting their first tattoo, this may be a less direct/stressful way of contacting the artist and provides clarity on what questions to expect.<\/li><\/ul><h4><strong>IMPORTANT:<\/strong><\/h4><p>In this case, client retention should be considered for hesitant customers, for whom direct contact might feel like too much of a commitment. It’s important to provide an option for direct contact that can encourage or engage them.<\/p><h4><strong>✏️ Summary:<\/strong><\/h4><p>The current manual tattoo reservation process is complex and time-consuming, which discourages some clients and takes up the tattoo artist's time. An automated booking system with a reservation form allows for the collection of all necessary information from the start, reducing communication time. At the same time, it’s important to maintain the option for direct contact for clients who need more engagement before making their decision.<\/p>"}, {"group": "Tattoo session booking app", "title": "Tattoo Artist search engine", "intro": "Current methods of searching for tattoo artists are limited, making it difficult for artists to attract clients and for users to find the right tattooist.", "body": "<h4><strong>⛔ Problem:<\/strong><\/h4><h4>Search Engine<\/h4><ul><li>Competing wit as relieved as they no longer needed to make calls to clients after incorrectly submitted forms.<\/li><\/ul><h4>Additionally:<\/h4><ul><li>We did not want to remove the \"ID Card\" option in non-Polish language versions, as some foreign users may have such an ID card or may speak Polish.<\/li><\/ul><h4><strong>✏️ Summary:<\/strong><\/h4><p>The \"ID card\" field only accepted Polish documents, which led to numerous errors in forms filled out by foreign users. Adding the information \"(Polish)\" to the field name significantly reduced the number of incorrect submissions, minimizing costs and relieving customer service.<\/p>"}], "cp": [{"title": "Dirty Biz", "tag": "Narrative · Gameplay and story", "body": "<p>In <em>Dirty Biz<\/em>, the player is drawn into a morally ambiguous case when <strong>Bryce Stone<\/strong>, a televangelist approaches you for help. His son was tragically kidnapped and murdered—but the NCPD dropped the case due to lack of evidence.<\/p><p>Bryce has located a <strong>heavily edited virtu recording (BD)<\/strong> of his son’s murder - but it hides the truth. The goal: find the raw, unedited <strong>BD_9430<\/strong> held by a father-and-son duo, <strong>Gottfrid and Fredrik<\/strong>. Only by retrieving the raw footage can Bryce - and perhaps the justice system - hope to uncover what really happened.<\/p><h4>Narrative Tension &amp; Choices<\/h4><ul><li><strong>Justice vs. Exploitation<\/strong>: The gig is rooted in seeking truth - a murdered child, an edited recording, and the idea of uncovering lies through media. It pits Bryce’s grief and moral need for authenticity against a world content with glossed-over versions of reality.<\/li><li><strong>Stealth or Aggression<\/strong>: You can enter the studio quietly (disable cameras, sneak through a technical entry, avoid detection), or you can go in guns blazing. These choices don’t drastically alter the outcome (you always get the raw recording), but they do change tone, player experience, and your sense of agency.<\/li><li><strong>Confrontation with the Perpetrators<\/strong>: When faced with Gottfrid and Fredrik, you can interrogate them, kill them, pressure them, or simply take the evidence and leave. These moments explore complicity, personal responsibility, and violence vs restraint.<\/li><\/ul><h4>Themes &amp; Impact<\/h4><ul><li><em>Dirty Biz<\/em> plays on ideas of <strong>media distortion<\/strong> and how truth can be manipulated - an edited virtu vs raw footage, what’s shown vs what’s hidden.<\/li><li>It explores what justice means in Night City: is getting the evidence enough, or does the manner you choose to do so matter morally?<\/li><li>It gives weight to player agency. While the core outcome is fixed (you retrieve the BD and hand it off), the path you take reflects your ethics and skills: stealth, tech, violence, or compassion.<\/li><\/ul><h4>Outcome &amp; Reflection<\/h4><p>At the end, once you’re in possession of the unedited recording and you deliver it to the drop point, the case is at least set on a more truthful foundation - even if full justice is still uncertain. The emotional weight doesn’t disappear: Bryce can potentially identify the killer; the player realizes their actions (whether violent, silent, or somewhere in between) shape not just the mission but the story around truth and loss.<\/p>", "links": [["Watch on YouTube", "https://www.youtube.com/watch?v=-yYKw7RPGZw"]]}, {"title": "Guinea Pigs", "tag": "Narrative · Gameplay and story", "body": "<p>The fixer <strong>Dino Dinovic<\/strong> hires V for a morally dark contract: eliminate <strong>Joanne Koch<\/strong>, a regional director at Biotechnica R&amp;D accused of treating people like test subjects. Rumors say her latest project killed over 70 from the Red Ochre (or Red Orchid) clan.<\/p><p>You are sent to the Biotechnica Corporate Hotel in City Center. Your objective: infiltrate the hotel, get into Joanne Koch’s apartment, neutralize her, and extract via a waiting AV.<\/p><h4>Narrative Tension &amp; Choices<\/h4><ul><li><strong>Science and Ethics vs Corporate Power<\/strong>: The premise confronts you with a corporate leader whose scientific work has crossed moral boundaries. Kane’s experiments aren’t theoretical-they’ve cost lives. The player is caught between monstrous wrongdoing and the chilling normalcy of corpo culture.<\/li><li><strong>Method Matters<\/strong>: You can go in loud - guns blazing - or quietly with stealth, quickhacks, disabling cameras, sneaking in via alternate routes, even dropping in from the roof. These choices shape how the mission feels: ruthless, precise, or merciful.<\/li><li><strong>Accountability and Consequence<\/strong>: Koch is more than the target; she’s symbolic. Taking her down is retribution, both for the Red Ochre families and for the ethical rot within Biotechnica. How you do it affects the narrative you carry with you. Does justice need elegance, or is it enough that it is done?<\/li><\/ul><h4>Themes &amp; Impact<\/h4><ul><li><em>Guinea Pigs<\/em> explores <strong>what happens when scientific progress is allowed to dehumanize<\/strong>, when people become data points, experiments, collateral damage.<\/li><li>It also forces the player to weigh <strong>means vs ends<\/strong>: not just what the outcome is, but how it was achieved - whether you embrace stealth, subterfuge, or brute force.<\/li><li>The mission builds empathy via absence (the victims, the grieving families) rather than presence - it’s the weight of what she’s done, more than dialog, more than cinematic moments, that drives it.<\/li><\/ul>", "links": [["Watch on YouTube", "https://www.youtube.com/watch?v=Fhcs1XRaUjE"]]}, {"title": "Hippocratic Oath", "tag": "Narrative · Gameplay and story", "body": "<p>In <em>Hippocratic Oath<\/em>, the player is tasked by fixer <strong>Regina Jones<\/strong> to extract <strong>Lucy Thackery<\/strong>, a ripperdoc captured by the <strong>Maelstrom<\/strong> gang. On arrival, the player discovers Lucy is refusing to abandon her oath as a doctor - she is desperately trying to save the life of a wounded gang member, even though his people are her captors.<\/p><p>This setup creates a tension between <strong>pragmatism and principle<\/strong>. The player can support Lucy’s act of compassion by assisting in the medical procedure, or dismiss her efforts and insist on escape. The outcome is always Lucy’s rescue, but the journey reflects the game’s recurring theme of morality under pressure: whether empathy has value in a world built on violence and transaction.<\/p><p>The gig turns a simple rescue into a <strong>character-driven moral vignette<\/strong>. Lucy’s stubborn humanity contrasts with the brutality of Night City, reminding the player that even in a fractured cyberpunk world, choices can affirm or erode the ideals that bind people together.<\/p>", "links": [["Watch on YouTube", "https://www.youtube.com/watch?v=g2XHBv1sM2U"]]}, {"title": "Psychofan", "tag": "Non-combat gameplay", "body": "", "links": [["Watch on YouTube", "https://www.youtube.com/watch?v=55d01m-iVeo"]]}, {"title": "Crowd & Scene Ambiance Systems", "tag": "Open world · System design", "body": "<p>Crowd generation is based on several systems<\/p><ul><li>Tag Spawning<\/li><li>Workspot Choice<\/li><li>City Scene System<\/li><\/ul><h4><strong>Tag Spawning<\/strong><\/h4><p>Each district/area/space has assigned tags - tags correspond to character visuals and behaviours - system recognizes currently active tags - eg. <strong>night, poor, exterior<\/strong> - and spawns npcs accordingly - there will be more drug addicts in poor areas, but no corporate looking people. There will be more gang activity at night etc.<\/p><h4><strong>Workspot Choice<\/strong><\/h4><p>Same system expands for specific animation choice - eg. any NPC can go up to a wall and lean on it, but only homeless will sit on cardboard bed.<\/p><p>NPC with backpack won’t sit on the bench because it would overlap with backpack, NPC with hat won’t scratch his head to not break the animation etc.<\/p><h4><strong>City Scene System<\/strong><\/h4><p>Normally scenes like<\/p><ul><li>Police having standoff with gang members<\/li><li>Group of people eating meal together<\/li><li>Friends throwing a party and dancing to music boasting from car<\/li><\/ul><p>would need to be placed by hand, every NPC spawned, animation set, object placed and script run.<\/p><p>City Scene System was based around prebuild scenes that would run based on specific algorithms<\/p><p>First of all specific scenes would spawn in specific areas - corporate guy sitting in the car and car bomb going off would have place in corporate area and gangers shooting to bottles would happen in city outskirts.<\/p><p>Secondly player shouldn’t see same scene twice too often, so system would see how much time passed since he last saw it, which place he saw it or even the angle that was observed and based on all those variables, the scene would be spawned again in different setting within specific algorithmically counted interval<\/p>", "links": [["Watch on YouTube", "https://www.youtube.com/watch?v=geCRfLCh58w"]]}], "gp": "data:image/webp;base64,UklGRlIoAABXRUJQVlA4IEYoAACwEQGdASqEA/kBPpVKo00lpCOooTPoiRASiWlu4F5el5sL1JwhOHkeakfExcOjarj18/rP6Tdu35gPN39I/+l37Peg8jj85f4D8aPCj/C/lh5//jvzb98/s/7Z/kh8ePyr5vuk/Mv+VfZL8J/bv3B/wnzX/e/95/hfGP4jf3nqC/jv8q/wX9m/cf/BcRntv+u/6nqEeuP0v/j/3z1Uvjf+/6H/X//u+4B/LP6f/xfXT/h+FB+O/5/sB/0X/GerX/f+Qn6o/+P+o+A3+hf3r/sdjD0qgl+ftFmwWGfL9Zl25jJkZddN3V7RTALbq9opgFt1QJrBZC2SIKRMkl3rsW5m/eZpZlsYR4s2MIBum7q9niyK8Rx+BC87R2wmKbkkqYkx51JFredHy1QU2JkZddQYuPf7YxYwcdfHg4aqFqrpID392bFjHDNQHG1CFaWbCAFgAC2mjDVghM2MWlenMkjpTwtOwYfctTpRjxxmcnTE45U9rX+3P2iePAF8dQRt+imjePedpWxjjziSfkKDZcBAdwo/2QmAkmcL62F63kALbZ6r3t5vCl8L6YnSXagTmzr44WWqwzQY/zFsHeMWu4SNdBlSKY6AdGinr3GUiZu8IMFsCn6lbypFwWAy9HDHF3cp/oXkGohLiQec4V4mTOdWH82SURqU9XRvedH0XjnWUjNEYBim3ISv/GDf+AYffIEH8/ec+k7jUAh34TWUxYl3oo8WXm/rfhVnFNhACnc8wR8D1SxBoVHKo3u72NeHnt5iJcs1ef+A+8eKW28tdrWtaw00OU {title:"Chupa Chups City",tag:"Brand collaboration · Perfetti Van Melle",m:{Brand:"Chupa Chups (Perfetti Van Melle)",Launch:"Nov 2024 · Alpha Season 4",Platform:"Windows, Mac"},
over:"A candy-themed city where players complete quests, collect Chupa Chups flavors, play tunes with Melody Pops and team up with other players. Quests include helping citizens plan a party, making music, exploring and breaking open a piñata for candy.",
brand:"Official collaboration with Perfetti Van Melle, the confectionery group behind Chupa Chups. It was The Sandbox’s first partnership with a candy brand. Exclusive Chupa Chups wearables (Flavor Shades, Cherry Cap, Lollipop Mask) launched with the experience, and a Game Jam before launch invited creators to build candy-inspired experiences.",
feat:["30 custom quests earning Ethos Points in Alpha Season 4","Melody Pops music gameplay","Piñata candy-collecting challenge","Exclusive avatar wearables"],
prob:"New players left the city hub before finishing their first quest because the objectives were spread across a large map.",
sol:"The first three quests were placed within sight of the spawn point, and the Melody Pops music game became the first low-pressure activity, so players earn early rewards before exploring further.",
url:"https://www.sandbox.game/en/experiences/Chupa%20Chups%20City/c4be0c04-526f-420f-a90c-660dd3bf9290/page/"},
{title:"Jurassic World: Dinosaur Preserve",tag:"Brand collaboration · Universal & Amblin",m:{Brand:"Jurassic World (Universal Products & Experiences, Amblin Entertainment)",Launch:"Mar 2025 · Alpha Season 5"},
over:"Players join the Dinosaur Protection Group at a dinosaur sanctuary in Arizona. They complete quests, earn points to grow dinosaur eggs and raise the hatched dinosaurs to adulthood.",
brand:"Part of a multi-year partnership between The Sandbox, Universal Products & Experiences and Amblin Entertainment. It was the flagship experience of Alpha Season 5, released with a limited collection of dinosaur eggs and Jurassic World avatars and wearables. LAND owners could later build their own Jurassic World experiences.",
feat:["Island split into six regions","Jurassic Points used to grow dinosaur eggs","Six bonus quests that unlock week by week during the season","Grown dinosaurs can be kept in a wallet or placed in player-made experiences"],
prob:"Players did not understand how their egg progress connected to the quests they were completing.",
sol:"Each quest reward was tied visibly to egg growth, and a progress tracker at the sanctuary entrance showed what was needed for the next growth stage.",
url:"http://sandbox.game/en/experiences/Jurassic%20World%3A%20Dinosaur%20Preserve/d48a9029-f321-4ac6-9dc8-7d78dc3c07d4/page/"},
{title:"The Playboy MetaMansion",tag:"Brand collaboration · Playboy",m:{Brand:"Playboy (PLBY Group)",Announced:"Jul 2022",Preview:"Playboy 69th Birthday, Dec 2022"},
over:"A Playboy-themed social gaming experience built around mini-games, social play, programmed events and ongoing digital collectible releases.",
brand:"Collaboration with Playboy that builds on its Rabbitar avatar community. Rabbitar holders and LAND owners get access to special experiences. A first preview, the Playboy 69th Birthday experience, ran from 12 to 19 December 2022 with play-and-earn rewards (KYC registration required) and a birthday collectible for completing a quest.",
feat:["Mini-games and social play","Programmed events","Extra rewards for Rabbitar and Party People holders","Ongoing collectible releases"],
prob:"Holders of special avatars and free players needed to share one space, and free players risked feeling locked out.",
sol:"The mansion was split into open social zones with full gameplay for everyone, plus holder-only areas that add extras without blocking the core experience.",
url:"https://www.sandbox.game/en/experiences/THE%20PLAYBOY%20METAMANSION%20/3f2add21-f647-4d1a-8f0b-3dc05d83fcf2/page/"},

over:"A chef and restaurant themed experience in The Sandbox. Details to be added.",

over:"An experience set around Gargamel’s castle, from the Smurfs universe.",

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shot=(img,alt,cls="",ph="Game screenshot")=>`<div class="shot ${cls}">${img?`<img src="${esc(img)}" alt="${esc(alt)}">`:ph}</div>`;
const meta=p=>Object.keys(p.m).length?`<dl>${Object.entries(p.m).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`:"";

const btns=l=>!EMBED?"":l.map(([a,u])=>`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(a)} ↗</a>`).join("");
const emb=u=>{let m,s="",c="";if(m=u.match(/youtube\.com\/watch\?v=([\w-]+)/))s="https://www.youtube-nocookie.com/embed/"+m[1];else if(m=u.match(/(docs\.google\.com\/(?:document|presentation)\/d\/[\w-]+)/)){s="https://"+m[1]+"/preview";c=" doc"}else if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)){s="https://drive.google.com/file/d/"+m[1]+"/preview";c=" doc"}return s?(EMBED?`<div class="vid${c}"><iframe src="${s}" loading="lazy" allowfullscreen referrerpolicy="no-referrer"></iframe></div>`:`<a class="vid play" href="${esc(u)}" target="_blank" rel="noopener"><span>▶</span><b>${/youtube/.test(u)?"Watch on YouTube":/presentation/.test(u)?"Open presentation":"Open document"}</b></a>`):""};
const embs=l=>`<div class="vids">${l.map(([a,u])=>emb(u)).join("")}</div>`;
const ext=(x,k)=>{const c=`${x.img?`<img src="${esc(x.img)}" alt="">`:""}<h5>${esc(x.t)}</h5><span>${esc(x.tag)}</span>${x.d?`<p>${esc(x.d)}</p>`:""}`;return `<a class="m" href="#item-${k}" data-go="item-${k}">${c}</a>`};
const li=(a,b)=>`<li><strong>${esc(a)}</strong> — ${esc(b)}</li>`;
const blocks=()=>`<h2>Core Competencies</h2><div class="cards">${about.skills.map(([k,v])=>`<div class="card"><h4>${esc(k)}</h4><div class="pills">${v.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div></div>`).join("")}</div>

["The Sandbox","Lead Game Designer","The Sandbox, TSB Game Maker","2023 – 2026",["Leading research and feature development on redesign of Level Creation tool into gamified User Generated Content (UGC) game maker","Designing seasonal live ops gameplay features","Mentoring design team"]],

${p.samples.length?`<h2>${esc(p.samplesTitle||"Level Design")}</h2><div class="tiles">${p.samples.map((l,j)=>`

}
function item(k){

<div class="phead"><p class="kicker">${k[0]=="p"?"Presentation":"Document"}</p><h1>${esc(x.t)}</h1><p class="role">${esc(x.tag)}</p></div>

function render(token){
const t=(token||"home").replace(/^#/,"");
let m,html;
if(t=="about")html=aboutPage();
else if(t=="resume")html=resumePage();
else if(m=t.match(/^project-(\d+)-sample-(\d+)$/)){const i=m[1]-1,j=m[2]-1;if(projects[i]&&projects[i].samples[j])html=sample(i,j)}
else if(m=t.match(/^project-(\d+)-level-(\d+)$/)){const i=m[1]-1,j=m[2]-1;if(projects[i]&&projects[i].levels&&projects[i].levels[j])html=level(i,j)}
else if(m=t.match(/^project-(\d+)$/)){const i=(+m[1]==2?1:+m[1])-1;if(projects[i])html=project(i)}
else if(m=t.match(/^item-([pd])-(\d+)$/)){if((m[1]=="p"?about.pres:about.docs)[m[2]-1])html=item(m[1]+"-"+m[2])}
else if(m=t.match(/^case-(\d+)$/)){const k=m[1]-1;if(D.cases[k])html=cs(k)}
document.getElementById("app").innerHTML=html||home();
window.scrollTo(0,0);
}
function go(token){
try{if(location.hash!=="#"+token)history.replaceState(null,"","#"+token)}catch(e){}
render(token);
}
document.addEventListener("click",e=>{
const el=e.target.closest("[data-go]");
if(!el||e.target.closest("a[target]"))return;
e.preventDefault();
go(el.getAttribute("data-go"));
});
window.addEventListener("hashchange",()=>render(location.hash));
render(location.hash);
</script>
